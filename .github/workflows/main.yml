name: Construir LOS REBELDES - 3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - dir: LOS_REBELDES_CLIENTE
            artifact: LOS-REBELDES-CLIENTE

          - dir: LOS_REBELDES_TRANSPORTISTA
            artifact: LOS-REBELDES-TRANSPORTISTA

          - dir: LOS_REBELDES_ADMIN
            artifact: LOS-REBELDES-ADMIN

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extraer proyecto
        run: |
          unzip -o LOS_REBELDES_3_APPS_v1-1.zip

            - name: Compilar APK
        working-directory: ${{ matrix.dir }}
        run: |
          cat > init.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release = 17
              }
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF
          gradle -I init.gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/app/build/outputs/apk/debug/app-debug.apk
