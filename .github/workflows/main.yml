name: Construir LOS REBELDES - 3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: LOS_REBELDES_CLIENTE
            artifact: LOS-REBELDES-CLIENTE
          - dir: LOS_REBELDES_TRANSPORTISTA
            artifact: LOS-REBELDES-TRANSPORTISTA
          - dir: LOS_REBELDES_ADMIN
            artifact: LOS-REBELDES-ADMIN

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extraer proyecto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o LOS_REBELDES_3_APPS_v1-1.zip

      - name: Corregir Java y Kotlin
        working-directory: ${{ matrix.dir }}
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          // Configuración CI: Java y Kotlin 17
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Compilar APK
        working-directory: ${{ matrix.dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}/app/build/outputs/apk/debug/app-debug.apk
